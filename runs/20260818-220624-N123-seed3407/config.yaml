harness_version: 2
model:
  id: Qwen/Qwen3-4B-Instruct-2507
  fallback_id: meta-llama/Llama-3.2-3B-Instruct
  max_seq_len: 4096
  load_in_4bit: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
train:
  seed: 3407
  per_device_batch_size: 2
  grad_accum_steps: 16
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.03
  epochs: 3
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: adamw_8bit
  logging_steps: 1
  save_strategy: 'no'
  packing: false
  max_steps: -1
data:
  path: /vol/data/v3_train.jsonl
  n: 123
  shuffle_before_subsample: true
output:
  runs_dir: runs
