# Smoke-test overrides: prove the training loop exits 0, NOT to make a model.
# Uses the small hybrid Qwen3-0.6B so the enable_thinking=False path is
# actually exercised, tiny seq len, 10 steps, batch 1, and works on CPU
# (4-bit is auto-disabled when CUDA is absent).
harness_version: 1

model:
  id: Qwen/Qwen3-0.6B
  fallback_id: HuggingFaceTB/SmolLM2-135M-Instruct
  max_seq_len: 256
  load_in_4bit: true       # auto-disabled on CPU

lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  seed: 3407
  per_device_batch_size: 1
  grad_accum_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler: constant
  warmup_ratio: 0.0
  epochs: 1
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch
  logging_steps: 1
  save_strategy: "no"
  packing: false
  max_steps: 10            # hard cap: exit-0 loop proof only

data:
  path: src/train/smoke_data.jsonl
  n: 4
  shuffle_before_subsample: true

output:
  runs_dir: runs
